[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avm-proofpack"
version = "0.4.0"
description = "Offline Algorand and Voi state-proof verification in Python: portable, recomputable transaction evidence anchored in state proofs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi" }]
keywords = ["algorand", "voi", "state-proofs", "state-proof-verification", "merkle", "verification", "offline", "python", "receipts", "transaction-evidence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chopmob-cloud/avm-proofpack"
Documentation = "https://docs.algovoi.co.uk/avm-proofpack"
Repository = "https://github.com/chopmob-cloud/avm-proofpack"
Issues = "https://github.com/chopmob-cloud/avm-proofpack/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
server = ["grpclib==0.4.7", "betterproto==2.0.0b7", "uvicorn==0.30.6"]

[project.scripts]
avm-proofpack = "avm_proofpack.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
# The consensus package (Falcon-1024 verification, state-proof reconstruction, coin
# message reconstruction) lives in the source tree for development and review
# but is NOT shipped: it is unwired, unproven as attestation, and must not reach
# `pip install avm-proofpack`. Excluded here so a wheel built from any checkout
# (clean or dirty) omits it.

[tool.setuptools.package-data]
avm_proofpack = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that require live network access to public nodes"]
