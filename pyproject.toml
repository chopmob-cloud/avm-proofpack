[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avm-proofpack"
version = "0.1.0"
description = "Portable, offline-verifiable transaction evidence for Algorand and Voi, anchored in state proofs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi" }]
keywords = ["algorand", "voi", "state-proofs", "merkle", "verification", "receipts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
avm-proofpack = "avm_proofpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avm_proofpack = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that require live network access to public nodes"]
